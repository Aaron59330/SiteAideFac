<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PostItBac – Révise avec des post-it</title>
  <meta name="description" content="Colle ton cours, obtiens des post-it numériques rangés par matière pour réviser le bac.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Navigation"></aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <input id="search" type="search" placeholder="Rechercher dans tes post-it…" aria-label="Rechercher">
        <div class="focus-wrap">
          <button id="focusBtn" class="pill-top" type="button">⏱ Focus</button>
          <div id="focusPanel" class="focus-panel" hidden>
            <p class="progress" id="fcMode">Concentration</p>
            <div class="fc-time" id="fcTemps">25:00</div>
            <div class="actions center">
              <button id="fcGo" class="btn primary" type="button">Démarrer</button>
              <button id="fcReset" class="btn" type="button">↺</button>
            </div>
            <div class="actions center">
              <button class="btn ghost" type="button" data-fc="25" data-fm="focus">25 min</button>
              <button class="btn ghost" type="button" data-fc="50" data-fm="focus">50 min</button>
              <button class="btn ghost" type="button" data-fc="5" data-fm="pause">Pause 5</button>
            </div>
            <p class="muted" id="fcAuj" style="text-align:center"></p>
          </div>
        </div>
        <div class="pill-top saved"><i class="dot"></i>Enregistré sur cet appareil</div>
      </header>
      <div id="view" class="page"></div>
      <footer>Tes cours restent sur ton appareil : rien n’est envoyé sur internet. Pense à « Sauvegarder » de temps en temps.</footer>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <button id="fermer" class="btn ghost close" aria-label="Fermer">✕</button>
      <p class="progress" id="rProgress"></p>
      <div id="rCarte" class="carte"></div>
      <div class="actions center" id="rActions"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input id="import" type="file" accept=".json" hidden>
  <script src="sheet-engine.js"></script>
  <script src="sheet-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
